description: "Tool Calling Evaluation - Go Implementation"

prompts:
  - |
    {{query}}

providers:
  - id: 'exec:./app'  
    config:
      temperature: 0

tests:
  - description: "Should call get_current_time for Bangladesh time query"
    vars:
      query: "What is the time and date now in Bangladesh?"
    assert:
      - type: contains
        value: "time"
      - type: contains
        value: "Bangladesh"

  - description: "Should call prime_minister_of_bangladesh for query about the prime minister of Bangladesh"
    vars:
      query: "who is the pm of Bangladesh?"
    assert:
      - type: contains
        value: "Tarique Rahman"

  - description: "Should handle unrelated query"
    vars:
      query: "What is the capital of india?"
    assert:
      - type: contains
        value: "Delhi"

